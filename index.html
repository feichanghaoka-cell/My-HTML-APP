<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>冲煮小助手</title>
<style>
:root{
  --bg:#f2f2f7; --cell:#fff; --ink:#000; --muted:rgba(60,60,67,.62); --line:rgba(60,60,67,.16); --fill:rgba(120,120,128,.14);
  --tint:#007aff; --green:#34c759; --red:#ff3b30; --segon:#fff;
  --glass:rgba(255,255,255,.66); --glassline:rgba(255,255,255,.8); --shadow:0 6px 24px rgba(0,0,0,.13);
  --pour:#0a84ff; --wait:#ff9f0a; --stir:#30d158; --press:#bf5af2; --ready:#ff9f0a; --water:#0a84ff;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --cell:#1c1c1e; --ink:#fff; --muted:rgba(235,235,245,.62); --line:rgba(84,84,88,.6); --fill:rgba(120,120,128,.3);
  --tint:#0a84ff; --green:#30d158; --red:#ff453a; --segon:#636366;
  --glass:rgba(50,50,54,.66); --glassline:rgba(255,255,255,.14); --shadow:0 6px 24px rgba(0,0,0,.55);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"PingFang SC","Helvetica Neue",Roboto,"Noto Sans SC",sans-serif;
  color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .18s cubic-bezier(.3,1.5,.5,1),opacity .15s}
button:active{transform:scale(.94);opacity:.75}
#stage{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 28px}
.page:has(.tabs) .body{padding-bottom:112px}
.glass,.nb,.tabs{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glassline);box-shadow:var(--shadow),inset 0 1px 0 var(--glassline)}

/* 转场 */
.in-push{animation:inR .42s cubic-bezier(.2,.85,.25,1);box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.out-push{animation:outL .42s cubic-bezier(.2,.85,.25,1) forwards}
.in-pop{animation:inL .42s cubic-bezier(.2,.85,.25,1)}
.out-pop{animation:outR .42s cubic-bezier(.2,.85,.25,1) forwards;z-index:2;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
.in-up{animation:inU .42s cubic-bezier(.2,.85,.25,1);z-index:2}
.out-down{animation:outD .4s cubic-bezier(.4,0,.7,.2) forwards;z-index:2}
.in-fade{animation:fade .3s ease}
@keyframes inR{from{transform:translateX(100%)}}
@keyframes outL{to{transform:translateX(-28%);opacity:.55}}
@keyframes inL{from{transform:translateX(-28%);opacity:.55}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes inU{from{transform:translateY(100%)}}
@keyframes outD{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes bounce{from{transform:scale(.4);opacity:0}}

/* 图标 */
.i{width:1em;height:1em;flex:none;vertical-align:-.14em;fill:currentColor;stroke:currentColor;overflow:visible}
.c-blue{fill:#0a84ff;stroke:#0a84ff}.c-amber,.c-orange{fill:#ff9f0a;stroke:#ff9f0a}.c-green{fill:#30d158;stroke:#30d158}
.c-purple{fill:#bf5af2;stroke:#bf5af2}.c-brown{fill:#a2845e;stroke:#a2845e}.c-red{fill:#ff453a;stroke:#ff453a}
.c-slate{fill:#8e8e93;stroke:#8e8e93}.c-white{fill:#fff;stroke:#fff}.c-gray{fill:var(--muted);stroke:var(--muted)}
.c-tabon{fill:var(--tint);stroke:var(--tint)}

/* 导航 */
.nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.nav h1{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.nav.root{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(26px + env(safe-area-inset-top)) 16px 10px 20px}
.nav.root>span{display:none}
.nav.root h1{font-size:32px;font-weight:800;letter-spacing:-.4px;text-align:left;max-width:none}
.nb{height:44px;min-width:44px;padding:0 16px;border-radius:22px;font-size:16px;font-weight:600;display:inline-grid;place-items:center}
.nb.back{justify-self:start;padding:0;width:44px}
.nb.right{justify-self:end;color:var(--tint)}
.nb.plus{padding:0;width:44px}
.nb .i{font-size:19px}

/* 悬浮标签栏 */
.tabs{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;
  display:flex;gap:2px;padding:4px;border-radius:34px;width:min(292px,calc(100% - 40px))}
.tabs button{flex:1;height:54px;border-radius:28px;color:var(--muted);font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{color:var(--tint);background:var(--fill)}
.tabs .i{font-size:24px}

/* 首页图标 */
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 6px;padding:12px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:7px}
.ico{width:84px;height:84px;border-radius:23%;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--k,#a2845e) 68%,#fff),var(--k,#a2845e));
  box-shadow:0 8px 18px color-mix(in srgb,var(--k,#a2845e) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.ico.sm{width:64px;height:64px;font-size:36px}
.app .nm{font-size:14px;font-weight:600}
.app .tm{font-size:12px;color:var(--muted);margin-top:-5px}
.tm .i{font-size:11px;margin-right:3px}

/* 分组列表 */
.gh{font-size:13px;font-weight:600;color:var(--muted);margin:22px 16px 8px;display:flex;align-items:center}
.gh .i{font-size:15px;margin-right:5px}
.group{background:var(--cell);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:7px 16px;width:100%;text-align:left;position:relative;
  font-size:17px;text-decoration:none;color:var(--ink)}
.row+.row::before,.fl+.fl::before,.srow+.srow::before,.srow+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
button.row:active,a.row:active{background:var(--fill);transform:none;opacity:1}
.row .ri{width:28px;flex:none;display:grid;place-items:center}
.ri .i{font-size:23px}
.row .tx{flex:1;min-width:0}
.row .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);opacity:.6;font-size:22px;flex:none}
.row.add{color:var(--tint)}
.row select{flex:1;min-width:0;height:38px;border:0;background:transparent;font:inherit;font-size:16px;color:var(--muted);
  text-align:right;text-align-last:right;direction:rtl;outline:none}
.row select option{direction:ltr}
.row .rl{flex:none}
.empty{text-align:center;color:var(--muted);padding:56px 10px 24px}
.empty .e{font-size:60px}.empty .t{font-size:19px;font-weight:600;margin-top:8px}

/* 配方页 */
.hero{display:flex;align-items:center;gap:14px;padding:6px 0 14px}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--cell);border-radius:32px;padding:6px}
.stepper .show{flex:1;text-align:center;font-size:26px;min-width:0;white-space:nowrap}
.stepper .show .i{margin:0 1px}
.rb{width:50px;height:50px;border-radius:50%;flex:none;font-size:28px;font-weight:500;line-height:1;display:inline-grid;place-items:center;
  background:var(--k,var(--fill));color:var(--tint)}
.rb[style]{color:#fff}
.rb:disabled{opacity:.35}
.rb .i{font-size:.8em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--cell);border-radius:22px;padding:10px 6px;text-align:center}
.tile .emo{font-size:24px;line-height:1.2}
.tile .num{font-size:28px;font-weight:700;line-height:1.15;font-family:ui-rounded,"SF Pro Rounded",inherit}
.tile .num small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.tile .lab{font-size:13px;color:var(--muted)}
.dots{display:flex;align-items:center;justify-content:center;gap:5px;height:29px}
.dots i{display:block;border-radius:50%;background:var(--fill)}
.dots i.on{background:#a2845e}
.path{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:14px 0 0;font-size:20px}
.path .arrow{color:var(--muted);opacity:.6;font-size:15px}
.foot{flex:none;padding:8px 16px calc(14px + env(safe-area-inset-bottom));margin-top:-18px;position:relative;
  background:linear-gradient(transparent,var(--bg) 45%)}
.big{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:27px;font-size:19px;font-weight:600;color:#fff;
  background:var(--k,var(--green));box-shadow:0 6px 18px color-mix(in srgb,var(--k,var(--green)) 35%,transparent)}
.big .i{font-size:.95em;margin-right:8px}
.big.red{background:var(--cell);color:var(--red);box-shadow:none}
.big.gray{background:rgba(255,255,255,.16);box-shadow:none}
.big.sm{min-height:50px;font-size:17px}

/* 冲煮 */
.page.dark{background:#000;color:#fff}
.brew{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:0;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  background:radial-gradient(130% 62% at 50% 0%,color-mix(in srgb,var(--c) 34%,#000),#000 78%);transition:background .4s}
.btop{display:flex;align-items:center;width:100%;gap:12px}
.steps{display:flex;gap:5px;flex:1;justify-content:center}
.steps i{height:6px;flex:1;max-width:34px;border-radius:3px;background:rgba(255,255,255,.2)}
.steps i.on{background:#fff}
.dark .rb:not(.xl){background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.16)}
.act{font-size:60px;line-height:1.1;margin-top:auto;animation:bounce .5s cubic-bezier(.3,1.5,.5,1)}
.say{font-size:34px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.goal{font-size:19px;font-weight:600;min-height:27px;color:rgba(235,235,245,.75)}
.cupwrap{position:relative;margin:16px 0 12px}
.cup{width:150px;height:132px;border:5px solid rgba(255,255,255,.92);border-top:0;border-radius:0 0 46px 46px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.07)}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(color-mix(in srgb,var(--water) 80%,#fff),var(--water))}
.cup .g{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:700;font-family:ui-rounded,"SF Pro Rounded",inherit}
.cup .g small{font-size:16px;font-weight:500}
.handle{position:absolute;right:-33px;top:20px;width:38px;height:56px;border:5px solid rgba(255,255,255,.92);border-left:0;border-radius:0 30px 30px 0}
.lcd{font-size:68px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;font-family:ui-rounded,"SF Pro Rounded",inherit}
.next{font-size:15px;color:rgba(235,235,245,.6);margin-top:6px;min-height:24px}
.next .i{font-size:16px;margin:0 4px}
.ctrl{display:flex;gap:22px;justify-content:center;align-items:center;margin-top:auto;padding-top:12px}
.rb.xl{width:76px;height:76px;font-size:32px;color:#000;background:#fff}
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(130% 62% at 50% 0%,#12542a,#000 78%)}
.done .e{font-size:104px;line-height:1;animation:bounce .7s cubic-bezier(.3,1.5,.5,1)}
.done .t{font-size:36px;font-weight:800;margin-top:6px}
.done .left{font-size:16px;color:rgba(235,235,245,.7);margin:8px 0 28px;min-height:24px}
.done .left .i{font-size:18px;margin-right:5px}
.done .big+.big{margin-top:12px}

/* 表单 */
.fl{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 16px;position:relative;font-size:17px}
.fl>span{flex:none;min-width:5.6em}
.fl>span .i{font-size:18px;margin-right:6px}
.fl input,.fl select{flex:1;min-width:0;height:42px;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);
  -webkit-user-select:text;user-select:text;outline:none;text-align:right}
.fl input::placeholder{color:var(--muted);opacity:.7}
.fl:only-child input{text-align:left}
.seg{flex:1;display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--segon);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.14)}
.emos{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.emos button{width:48px;height:48px;border-radius:14px;background:var(--fill);font-size:27px;display:grid;place-items:center}
.emos button.on{outline:2.5px solid var(--tint);outline-offset:1px}
.emos button.on .i{fill:var(--tint);stroke:var(--tint)}
.srow{display:grid;grid-template-columns:1.35fr 1fr 1fr 34px;gap:6px;padding:7px 12px;align-items:center;position:relative}
.srow input,.srow select{width:100%;height:40px;border:0;border-radius:11px;background:var(--fill);font:inherit;font-size:16px;padding:0 9px;
  color:var(--ink);-webkit-user-select:text;user-select:text;outline:none}
.srow .x{width:26px;height:26px;border-radius:50%;margin:auto;font-size:20px;line-height:1;color:#fff;font-weight:700;background:var(--red)}
.shead{display:grid;grid-template-columns:1.35fr 1fr 1fr 34px;gap:6px;font-size:12px;color:var(--muted);padding:0 20px 6px}
.err{color:var(--red);font-size:15px;font-weight:600;text-align:center;min-height:24px;margin:14px 0 6px}
.gap{height:12px}
@media (max-height:640px){.act{font-size:44px}.say{font-size:28px}.cup{height:104px}.lcd{font-size:50px}}
</style>
</head>

<div id="stage"></div>

viewBox="0 0 24 24"><path d="M12 2.300c4.200 5.300 6.700 8.900 6.700 12.200a6.700 6.700 0 0 1-13.400 0c0-3.300 2.500-6.900 6.700-12.200z" stroke="none"/></symbol><symbol id="i-wait" viewBox="0 0 24 24"><path d="M6.500 2h11a1 1 0 0 1 0 2h-.300v2.600c0 1.400-.700 2.700-1.800 3.500L13.700 12l1.700 1.900c1.100.800 1.800 2.100 1.800 3.500V20h.300a1 1 0 0 1 0 2h-11a1 1 0 0 1 0-2h.300v-2.600c0-1.400.700-2.700 1.800-3.500L10.300 12 8.600 10.100C7.500 9.300 6.800 8 6.800 6.600V4h-.300a1 1 0 0 1 0-2z" stroke="none"/></symbol><symbol id="i-spoon" viewBox="0 0 24 24"><ellipse cx="8" cy="7.200" rx="4.200" ry="5.800" transform="rotate(-40 8 7.200)" stroke="none"/><path d="M10.800 10.800L20.300 21" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="M10 2h4a.700.700 0 0 1 .700.700V10h3.100a.600.600 0 0 1 .450 1l-5.800 6.500a.600.600 0 0 1-.900 0L5.750 11a.600.600 0 0 1 .450-1h3.100V2.700A.700.700 0 0 1 10 2z" stroke="none"/><path d="M4.500 19.600h15a1.200 1.200 0 0 1 0 2.400h-15a1.200 1.200 0 0 1 0-2.400z" stroke="none"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M4.500 12.800l5 5L19.500 6.500" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-thermo" viewBox="0 0 24 24"><path d="M9.800 4.200a2.200 2.200 0 0 1 4.400 0v8.600a5 5 0 1 1-4.400 0z" stroke="none"/></symbol><symbol id="i-grinder" viewBox="0 0 24 24"><circle cx="19.300" cy="3.200" r="1.900" stroke="none"/><path d="M12 6.500V3.200h6.500" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.500 6.200h9a.900.900 0 0 1 0 1.800h-9a.900.900 0 0 1 0-1.800z" stroke="none"/><path d="M8.200 8.800h7.600v11.700a1.500 1.500 0 0 1-1.500 1.500H9.700a1.500 1.500 0 0 1-1.500-1.500z" stroke="none"/><path d="M8.200 14.500h7.600" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:#000;stroke-opacity:.38"/></symbol><symbol id="i-filter" viewBox="0 0 24 24"><path d="M3.300 5h17.400a.800.800 0 0 1 .700 1.200L13 20.800a1.150 1.150 0 0 1-2 0L2.600 6.200A.800.800 0 0 1 3.300 5z" stroke="none"/><path d="M12 5.500v15" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="stroke:#000;stroke-opacity:.38"/></symbol><symbol id="i-video" viewBox="0 0 24 24"><path fill-rule="evenodd" stroke="none" d="M4.500 4.500h15A2.500 2.500 0 0 1 22 7v10a2.500 2.500 0 0 1-2.500 2.500h-15A2.500 2.500 0 0 1 2 17V7a2.500 2.500 0 0 1 2.500-2.500zM10 8.300v7.400l6.200-3.700z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M10.400 4h3.200v6.400H20v3.200h-6.400V20h-3.200v-6.400H4v-3.200h6.400z" stroke="none"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M7.500 4.200a.800.800 0 0 1 1.200-.700l12 7.800a.800.800 0 0 1 0 1.400l-12 7.800a.800.800 0 0 1-1.200-.700z" stroke="none"/></symbol><symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.200v16H6zM13.800 4H18v16h-4.200z" stroke="none"/></symbol><symbol id="i-skip" viewBox="0 0 24 24"><path d="M4.500 4.500l9.500 7.500-9.500 7.500zM15.500 4.500h3.500v15h-3.500z" stroke="none"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.800l9.300 8.400h-2.600v9.300h-4.500v-6h-4.400v6H5.300v-9.300H2.700z" stroke="none"/></symbol><symbol id="i-repeat" viewBox="0 0 24 24"><path d="M19.200 12.500a7.200 7.200 0 1 1-2.400-5.700" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.500 2.500v6.800h-6.800z" stroke="none"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M9.300 2.800h5.400l.900 1.900H20v2.100H4V4.700h4.400zM5.800 8.400h12.400l-.900 12.300a1.400 1.400 0 0 1-1.400 1.300H8.100a1.400 1.400 0 0 1-1.400-1.300z" stroke="none"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.600" fill="none" stroke-width="2.200"/><path d="M12 7.500V12l3 2" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
<script>
const TYPES = {
  ready:{icon:'check', k:'orange', label:'准备好',  c:'var(--ready)'},
  pour: {icon:'drop', k:'blue', label:'倒水',    c:'var(--pour)'},
  wait: {icon:'wait', k:'amber', label:'等一等',  c:'var(--wait)'},
  stir: {icon:'spoon', k:'green', label:'搅一搅',  c:'var(--stir)'},
  press:{icon:'down', k:'purple', label:'往下压',  c:'var(--press)'},
};
const GRIND = ['很细','细','中等','粗','很粗'];
const EMOJIS = ['cup','v60','aero','press','kettle','ice','milk','leaf','star'];
const OLD = {'☕':'cup','🫖':'kettle','🧊':'ice','🥛':'milk','🍵':'leaf','🧪':'aero','🏺':'press','⭐':'star'};
const I = (name, cls) => `<svg class="i ${cls || ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const tI = (t, plain) => I(TYPES[t].icon, plain ? '' : 'c-' + TYPES[t].k);
const rIcon = r => OLD[r.emo] || (EMOJIS.includes(r.emo) ? r.emo : 'cup');
const COLORS = ['#a2845e','#007aff','#ff9500','#34c759','#af52de','#ff3b30','#30b0c7','#5856d6'];
const KINDS = {
  grinder:{icon:'grinder', label:'磨豆机'},
  dripper:{icon:'v60', label:'滤杯'},
  filter: {icon:'filter', label:'滤纸'},
};
const ROAST = ['浅','中','深'];
// 所有克数都按 1 杯计算
const SEED = [
  {id:'v60', name:'手冲 V60', emo:'v60', coffee:15, water:240, temp:92, grind:1, video:'', steps:[
    {t:'pour',s:10,to:30,label:'慢慢倒水'},{t:'wait',s:25},
    {t:'pour',s:25,to:150},{t:'wait',s:15},
    {t:'pour',s:25,to:240},{t:'wait',s:50,label:'等水滴完'}]},
  {id:'aero', name:'爱乐压', emo:'aero', coffee:15, water:220, temp:85, grind:1, video:'', steps:[
    {t:'pour',s:15,to:220},{t:'stir',s:10},{t:'wait',s:65},{t:'press',s:30}]},
  {id:'french', name:'法压壶', emo:'press', coffee:15, water:250, temp:93, grind:3, video:'', steps:[
    {t:'pour',s:20,to:250},{t:'wait',s:220},{t:'stir',s:10},{t:'press',s:20}]},
  {id:'clever', name:'聪明杯', emo:'kettle', coffee:15, water:240, temp:90, grind:2, video:'', steps:[
    {t:'pour',s:20,to:240},{t:'wait',s:120},{t:'wait',s:60,label:'放到杯子上'}]},
];

const stage = document.getElementById('stage');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return s >= 60 ? Math.floor(s/60) + ':' + String(s%60).padStart(2,'0') : String(s); };
const total = r => r.steps.reduce((a,x) => a + x.s, 0);
const clone = o => JSON.parse(JSON.stringify(o));
const okUrl = u => /^https?:\/\/\S+$/i.test(u || '');

const KEY = 'brew.db';
let db = null;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!db || !Array.isArray(db.recipes)) db = {recipes:clone(SEED), beans:[], gear:[]};
db.beans = db.beans || []; db.gear = db.gear || [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} };

let cur = null, cups = 1, draft = null, F = null, brew = null, timer = null, audio = null, lock = null;

/* ---------- 画面切换 ---------- */
function show(html, anim, cls){
  const pages = [...stage.children], old = pages.pop();
  pages.forEach(p => p.remove());
  const pg = document.createElement('div');
  pg.className = 'page' + (cls ? ' ' + cls : '');
  pg.innerHTML = html;
  if (!old || !anim) {
    const st = old && old.querySelector('.body') ? old.querySelector('.body').scrollTop : 0;
    if (old) old.remove();
    stage.appendChild(pg);
    const b = pg.querySelector('.body'); if (b && anim === 0) b.scrollTop = st;
    return;
  }
  if (anim === 'down') { stage.insertBefore(pg, old); old.classList.add('out-down'); }
  else {
    stage.appendChild(pg); pg.classList.add('in-' + anim);
    if (anim === 'push' || anim === 'pop') old.classList.add('out-' + anim);
  }
  setTimeout(() => old.remove(), 420);
}
const nav = (title, left, right) => `<div class="nav ${left ? '' : 'root'}">
  ${left ? `<button class="nb back" data-act="${left.act}" aria-label="${esc(left.label)}">${I('chev')}</button>` : '<span></span>'}
  <h1>${esc(title)}</h1>
  ${right ? `<button class="nb right ${right.plus ? 'plus' : ''}" data-act="${right.act}" aria-label="${esc(right.aria || right.label)}">${right.plus ? I('plus') : esc(right.label)}</button>` : '<span></span>'}</div>`;
const tabs = on => `<div class="tabs">` + [['brew','cup','冲煮'],['beans','bean','豆子'],['gear','grinder','器具']].map(t =>
  `<button data-act="tab" data-tab="${t[0]}" class="${t[0]===on?'on':''}">${I(t[1], t[0]===on ? 'c-tabon' : 'c-gray')}${t[2]}</button>`).join('') + `</div>`;
const ico = (r, sm) => `<div class="ico ${sm ? 'sm' : ''}" style="--k:${COLORS[Math.max(0, db.recipes.indexOf(r)) % COLORS.length]}">${I(rIcon(r), 'c-white')}</div>`;

/* ---------- 冲煮(首页) ---------- */
function home(anim){
  stopBrew();
  show(nav('今天喝什么?', null, {act:'newRecipe', label:'＋', plus:true, aria:'新配方'}) +
    `<div class="body">` + (db.recipes.length ? `<div class="icons">` + db.recipes.map(r =>
      `<button class="app" data-act="open" data-id="${esc(r.id)}">${ico(r)}<div class="nm">${esc(r.name)}</div><div class="tm">${I('clock')}${fmt(total(r))}</div></button>`).join('') + `</div>`
      : `<div class="empty"><div class="e">${I('cup','c-slate')}</div><div class="t">还没有配方</div></div><button class="big" data-act="newRecipe">＋ 新配方</button>`) +
    `</div>` + tabs('brew'), anim);
}

/* ---------- 配方页 ---------- */
function dots(n){
  return `<div class="dots">` + [0,1,2,3,4].map(i => { const d = 8 + i*5; return `<i class="${i===n?'on':''}" style="width:${d}px;height:${d}px"></i>`; }).join('') + `</div>`;
}
function pick(icon, k2, label, key, list, nameOf){
  return `<label class="row"><span class="ri">${I(icon, k2)}</span><span class="rl">${label}</span>
    <select data-pick="${key}"><option value="">不选</option>${list.map(x => `<option value="${esc(x.id)}" ${cur[key]===x.id?'selected':''}>${esc(nameOf(x))}</option>`).join('')}</select></label>`;
}
function recipe(anim){
  const r = cur, g = k => db.gear.filter(x => x.kind === k);
  show(nav(r.name, {act:'home', label:'返回'}, {act:'editRecipe', label:'修改'}) + `<div class="body">
    <div class="hero">${ico(r, true)}
      <div class="stepper">
        <button class="rb" data-act="less" ${cups<=1?'disabled':''} aria-label="少一杯">−</button>
        <div class="show" aria-label="${cups} 杯">${I('cup','c-brown').repeat(cups)}</div>
        <button class="rb" data-act="more" ${cups>=4?'disabled':''} aria-label="多一杯">+</button>
      </div></div>
    <div class="tiles">
      <div class="tile"><div class="emo">${I('bean','c-brown')}</div><div class="num">${Math.round(r.coffee*cups)}<small>克</small></div><div class="lab">咖啡粉</div></div>
      <div class="tile"><div class="emo">${I('drop','c-blue')}</div><div class="num">${Math.round(r.water*cups)}<small>克</small></div><div class="lab">水</div></div>
      <div class="tile"><div class="emo">${I('thermo','c-red')}</div><div class="num">${r.temp}<small>°C</small></div><div class="lab">水温</div></div>
      <div class="tile">${dots(r.grind)}<div class="num" style="font-size:21px;line-height:1.6">${GRIND[r.grind]}</div><div class="lab">磨多细</div></div>
    </div>
    <div class="path">${r.steps.map(s => tI(s.t)).join('<span class="arrow">›</span>')}</div>
    ${okUrl(r.video) ? `<div class="gh">视频</div><div class="group"><a class="row" href="${esc(r.video)}" target="_blank" rel="noopener"><span class="ri">${I('video','c-red')}</span><span class="tx">看视频怎么做</span><span class="chev">›</span></a></div>` : ''}
    <div class="gh">今天用什么</div>
    <div class="group">
      ${pick('bean','c-brown','豆子','bean',db.beans, b => b.name + ' (剩' + Math.round(b.grams || 0) + '克)')}
      ${pick(KINDS.grinder.icon,'c-slate','磨豆机','grinder',g('grinder'), x => x.name)}
      ${pick(KINDS.dripper.icon,'c-slate','滤杯','dripper',g('dripper'), x => x.name)}
      ${pick(KINDS.filter.icon,'c-slate','滤纸','filter',g('filter'), x => x.name)}
    </div></div>
    <div class="foot"><button class="big" data-act="start">${I('play')}开始</button></div>`, anim);
}

/* ---------- 冲煮计时 ---------- */
function beep(n){
  if (!audio) return;
  try {
    for (let i = 0; i < n; i++) {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i*0.22;
      o.frequency.value = n > 1 ? 1040 : 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    }
    if (navigator.vibrate) navigator.vibrate(n > 1 ? [150,80,150,80,300] : 150);
  } catch(e) {}
}
function startBrew(anim){
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch(e) {}
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => lock = l).catch(() => {}); } catch(e) {}
  clearInterval(timer);
  brew = { steps:[{t:'ready', s:3}].concat(cur.steps), i:0, el:0, last:performance.now(), paused:false };
  drawStep(anim);
  timer = setInterval(tick, 100);
}
function stopBrew(){
  clearInterval(timer); timer = null; brew = null;
  if (lock) { try { lock.release(); } catch(e) {} lock = null; }
}
function waterBefore(i){
  let w = 0; for (let k = 0; k < i; k++) if (brew.steps[k].t === 'pour') w = brew.steps[k].to; return w;
}
function drawStep(anim){
  const s = brew.steps[brew.i], T = TYPES[s.t], nx = brew.steps[brew.i+1];
  const goal = s.t === 'pour' ? `秤上到 ${Math.round(s.to*cups)} 克` : s.t === 'ready' ? `放好 ${Math.round(cur.coffee*cups)} 克咖啡粉` : '';
  show(`<div class="brew" style="--c:${T.c}">
    <div class="btop"><button class="rb" style="--k:#7a8798" data-act="quit" aria-label="退出">${I('close')}</button>
      <div class="steps">${brew.steps.slice(1).map((_,k) => `<i class="${k < brew.i ? 'on' : ''}"></i>`).join('')}</div>
      <div style="width:52px"></div></div>
    <div class="act">${tI(s.t)}</div>
    <div class="say">${esc(s.label || T.label)}</div>
    <div class="goal">${goal}</div>
    <div class="cupwrap"><div class="cup"><div class="fill"></div><div class="g"><span><span class="gn">0</span><small> 克</small></span></div></div><div class="handle"></div></div>
    <div class="lcd"></div>
    <div class="next">${nx ? '下一步 ' + tI(nx.t) + esc(nx.label || TYPES[nx.t].label) : '马上好啦'}</div>
    <div class="ctrl">
      <button class="rb xl pp" style="--k:${T.c}" data-act="pause" aria-label="暂停或继续">${I(brew.paused ? 'play' : 'pause')}</button>
      <button class="rb" style="--k:#7a8798" data-act="skip" aria-label="下一步">${I('skip')}</button>
    </div></div>`, anim, 'dark');
  paint();
}
function paint(){
  const pg = stage.querySelector('.page.dark:not(.out-down)'); if (!pg || !brew) return;
  const s = brew.steps[brew.i], before = waterBefore(brew.i);
  const p = Math.min(1, brew.el / s.s);
  const w = s.t === 'pour' ? before + (s.to - before) * p : before;
  const f = pg.querySelector('.fill'); if (!f) return;
  f.style.height = (cur.water ? Math.min(1, w / cur.water) * 88 : 0) + '%';
  pg.querySelector('.gn').textContent = Math.round(w * cups);
  pg.querySelector('.lcd').textContent = fmt(s.s - brew.el);
}
function nextStep(){
  brew.i++; brew.el = 0;
  if (brew.i >= brew.steps.length) { beep(3); stopBrew(); return done(); }
  beep(1); drawStep();
}
function tick(){
  if (!brew) return;
  const now = performance.now();
  if (!brew.paused) brew.el += (now - brew.last) / 1000;
  brew.last = now;
  if (brew.el >= brew.steps[brew.i].s) nextStep(); else paint();
}
function done(){
  let left = '';
  const b = db.beans.find(x => x.id === cur.bean);
  if (b) { b.grams = Math.max(0, Math.round((b.grams || 0) - cur.coffee * cups)); save(); left = `${I('bean','c-brown')}${esc(b.name)} 还剩 ${b.grams} 克`; }
  show(`<div class="done"><div class="e">${I('cup','c-white sh')}</div><div class="t">好啦!</div><div class="left">${left}</div>
    <button class="big" data-act="again">${I('repeat')}再来一杯</button>
    <button class="big gray" data-act="home2">${I('home')}回首页</button></div>`, 'fade', 'dark');
}

/* ---------- 豆子 ---------- */
function days(d){ const t = Date.parse(d); return isNaN(t) ? null : Math.floor((Date.now() - t) / 864e5); }
function beans(anim){
  show(nav('我的豆子', null, {act:'newBean', label:'＋', plus:true, aria:'添加豆子'}) + `<div class="body">` +
    (db.beans.length ? `<div class="group">` + db.beans.map(b => { const n = days(b.roastDate);
      return `<button class="row" data-act="editBean" data-id="${esc(b.id)}"><span class="ri">${I('bean','c-brown')}</span>
        <span class="tx">${esc(b.name)}<span class="sub">${[b.roaster, b.origin, ROAST[b.roast] + '烘', n !== null && n >= 0 ? '烘好第 ' + n + ' 天' : '', '剩 ' + Math.round(b.grams || 0) + ' 克'].filter(Boolean).map(esc).join(' · ')}</span></span>
        <span class="chev">›</span></button>`; }).join('') + `</div>`
     : `<div class="empty"><div class="e">${I('bean','c-slate')}</div><div class="t">还没有豆子</div></div><button class="big" data-act="newBean">＋ 添加豆子</button>`) +
    `</div>` + tabs('beans'), anim);
}
const BEAN_FIELDS = [
  {k:'name', label:'名字', ph:'比如 耶加雪菲'}, {k:'roaster', label:'烘豆商', ph:'选填'}, {k:'origin', label:'产地', ph:'选填'},
  {k:'roast', label:'烘焙度', type:'seg', opts:ROAST}, {k:'roastDate', label:'烘焙日期', type:'date'},
  {k:'grams', label:'还剩(克)', type:'number'}, {k:'note', label:'备注', ph:'风味、心得…'},
];
function beanForm(b){
  F = {title: b ? '修改豆子' : '新豆子', fields:BEAN_FIELDS, isNew:!b, back:beans,
    obj: b ? clone(b) : {id:'', name:'', roaster:'', origin:'', roast:1, roastDate:'', grams:200, note:''},
    save(o){ if (!(o.grams >= 0)) o.grams = 0; put(db.beans, o, 'b'); },
    del(o){ db.beans = db.beans.filter(x => x.id !== o.id); }};
  drawForm('push');
}

/* ---------- 器具 ---------- */
function gear(anim){
  show(nav('我的器具') + `<div class="body">` + Object.keys(KINDS).map(k => `<div class="gh">${I(KINDS[k].icon)}${KINDS[k].label}</div><div class="group">` +
    db.gear.filter(x => x.kind === k).map(x => `<button class="row" data-act="editGear" data-id="${esc(x.id)}"><span class="ri">${I(KINDS[k].icon,'c-slate')}</span>
      <span class="tx">${esc(x.name)}${x.note ? `<span class="sub">${esc(x.note)}</span>` : ''}</span><span class="chev">›</span></button>`).join('') +
    `<button class="row add" data-act="newGear" data-kind="${k}"><span class="ri">${I('plus','c-green')}</span><span class="tx">添加${KINDS[k].label}</span></button></div>`).join('') +
    `</div>` + tabs('gear'), anim);
}
function gearForm(x, kind){
  kind = x ? x.kind : kind;
  F = {title:(x ? '修改' : '新') + KINDS[kind].label, isNew:!x, back:gear,
    fields:[{k:'name', label:'名字', ph: kind === 'grinder' ? '比如 C40' : kind === 'dripper' ? '比如 V60 01' : '比如 漂白 01 号'},
            {k:'note', label:'备注', ph: kind === 'grinder' ? '常用刻度…' : '选填'}],
    obj: x ? clone(x) : {id:'', kind, name:'', note:''},
    save(o){ put(db.gear, o, 'g'); }, del(o){ db.gear = db.gear.filter(y => y.id !== o.id); }};
  drawForm('push');
}

/* ---------- 通用表单 ---------- */
function put(list, o, prefix){
  if (o.id) list[list.findIndex(x => x.id === o.id)] = o;
  else { o.id = prefix + Date.now(); list.push(o); }
}
function drawForm(anim, err){
  const o = F.obj;
  show(nav(F.title, {act:'formBack', label:'返回'}, {act:'formSave', label:'保存'}) + `<div class="body"><div class="group">` +
    F.fields.map(f => `<label class="fl"><span>${f.label}</span>` + (f.type === 'seg'
      ? `<div class="seg">${f.opts.map((t,i) => `<button type="button" data-act="seg" data-k="${f.k}" data-v="${i}" class="${o[f.k]===i?'on':''}">${t}</button>`).join('')}</div>`
      : `<input data-ff="${f.k}" type="${f.type || 'text'}" ${f.type === 'number' ? 'inputmode="decimal"' : ''} value="${esc(o[f.k])}" placeholder="${esc(f.ph || '')}">`) + `</label>`).join('') +
    `</div><div class="err">${err || ''}</div>
    <button class="big" data-act="formSave">${I('check')}保存</button>
    ${F.isNew ? '' : `<div class="gap"></div><button class="big red sm" data-act="formDel">${I('trash')}删除</button>`}</div>`, anim === undefined ? 0 : anim);
}

/* ---------- 配方编辑 ---------- */
function editRecipe(r){
  draft = r ? clone(r) : {id:'', name:'', emo:'cup', coffee:15, water:240, temp:92, grind:2, video:'',
    steps:[{t:'pour',s:10,to:30},{t:'wait',s:25},{t:'pour',s:30,to:240},{t:'wait',s:60}]};
  drawEdit('push');
}
function drawEdit(anim, err){
  const d = draft;
  show(nav(d.id ? '修改配方' : '新配方', {act:'editBack', label:'返回'}, {act:'saveRecipe', label:'保存'}) + `<div class="body">
    <div class="group"><label class="fl"><span>名字</span><input data-f="name" value="${esc(d.name)}" placeholder="我的配方" maxlength="12"></label></div>
    <div class="gh">图标</div>
    <div class="group"><div class="emos">${EMOJIS.map(e => `<button data-act="emo" data-e="${e}" class="${e===rIcon(d)?'on':''}" aria-label="${e}">${I(e,'c-slate')}</button>`).join('')}</div></div>
    <div class="gh">一杯的用量</div>
    <div class="group">
      <label class="fl"><span>${I('bean','c-brown')}咖啡粉(克)</span><input data-f="coffee" type="number" inputmode="decimal" value="${esc(d.coffee)}"></label>
      <label class="fl"><span>${I('drop','c-blue')}水(克)</span><input data-f="water" type="number" inputmode="decimal" value="${esc(d.water)}"></label>
      <label class="fl"><span>${I('thermo','c-red')}水温(°C)</span><input data-f="temp" type="number" inputmode="decimal" value="${esc(d.temp)}"></label>
      <label class="fl"><span>${I('grinder','c-slate')}磨多细</span><div class="seg">${GRIND.map((g,i) => `<button type="button" data-act="grind" data-v="${i}" class="${i===d.grind?'on':''}" style="font-size:13px">${g}</button>`).join('')}</div></label>
    </div>
    <div class="gh">步骤</div>
    <div class="shead"><span>做什么</span><span>多少秒</span><span>倒到几克</span><span></span></div>
    <div class="group">${d.steps.map((s,i) => `<div class="srow">
      <select data-s="${i}" data-k="t">${['pour','wait','stir','press'].map(t => `<option value="${t}" ${t===s.t?'selected':''}>${TYPES[t].label}</option>`).join('')}</select>
      <input data-s="${i}" data-k="s" type="number" inputmode="numeric" value="${esc(s.s)}" aria-label="秒">
      ${s.t === 'pour' ? `<input data-s="${i}" data-k="to" type="number" inputmode="decimal" value="${esc(s.to)}" aria-label="倒到几克">` : '<span></span>'}
      <button class="x" data-act="rmstep" data-i="${i}" aria-label="删掉这一步">−</button></div>`).join('')}
      <button class="row add" data-act="addstep"><span class="ri">${I('plus','c-green')}</span><span class="tx">加一步</span></button></div>
    <div class="gh">${I('video')}视频链接</div>
    <div class="group"><label class="fl"><input data-f="video" type="url" inputmode="url" value="${esc(d.video)}" placeholder="贴上 BBB 啡常好咖 的视频网址"></label></div>
    <div class="err">${err || ''}</div>
    <button class="big" data-act="saveRecipe">${I('check')}保存</button>
    ${d.id ? `<div class="gap"></div><button class="big red sm" data-act="delRecipe">${I('trash')}删除配方</button>` : ''}</div>`, anim === undefined ? 0 : anim);
}
function saveRecipe(){
  const d = draft, bad = m => drawEdit(0, m);
  d.name = (d.name || '').trim(); d.video = (d.video || '').trim();
  if (!d.name) return bad('先起个名字');
  if (!(d.coffee > 0) || !(d.water > 0)) return bad('咖啡粉和水要大于 0');
  if (!(d.temp > 0)) return bad('填一下水温');
  if (!d.steps.length) return bad('至少要有一步');
  for (const s of d.steps) {
    if (!(s.s > 0)) return bad('每一步的秒数要大于 0');
    if (s.t === 'pour') { if (!(s.to > 0)) return bad('倒水的步骤要填倒到几克'); } else delete s.to;
  }
  if (d.video && !okUrl(d.video)) return bad('视频链接要以 http 开头');
  put(db.recipes, d, 'r'); save(); cur = d; draft = null; recipe('pop');
}

/* ---------- 事件 ---------- */
const ACT = {
  tab(b){ ({brew:home, beans, gear})[b.dataset.tab](); },
  home(){ home('pop'); },
  home2(){ home('fade'); },
  open(b){ cur = db.recipes.find(r => r.id === b.dataset.id); cups = 1; recipe('push'); },
  less(){ cups = Math.max(1, cups-1); recipe(0); },
  more(){ cups = Math.min(4, cups+1); recipe(0); },
  start(){ startBrew('up'); },
  again(){ startBrew('fade'); },
  quit(){ stopBrew(); recipe('down'); },
  pause(b){ brew.paused = !brew.paused; brew.last = performance.now(); b.innerHTML = I(brew.paused ? 'play' : 'pause'); },
  skip(){ nextStep(); },
  newRecipe(){ editRecipe(null); },
  editRecipe(){ editRecipe(cur); },
  editBack(){ draft.id ? recipe('pop') : home('pop'); draft = null; },
  saveRecipe,
  delRecipe(){ if (confirm('删掉「' + cur.name + '」?')) { db.recipes = db.recipes.filter(r => r.id !== draft.id); save(); draft = null; home('pop'); } },
  emo(b){ draft.emo = b.dataset.e; drawEdit(); },
  grind(b){ draft.grind = +b.dataset.v; drawEdit(); },
  addstep(){ draft.steps.push({t:'wait', s:30}); drawEdit(); },
  rmstep(b){ draft.steps.splice(+b.dataset.i, 1); drawEdit(); },
  newBean(){ beanForm(null); },
  editBean(b){ beanForm(db.beans.find(x => x.id === b.dataset.id)); },
  newGear(b){ gearForm(null, b.dataset.kind); },
  editGear(b){ gearForm(db.gear.find(x => x.id === b.dataset.id)); },
  seg(b){ F.obj[b.dataset.k] = +b.dataset.v; drawForm(); },
  formBack(){ F.back('pop'); },
  formSave(){
    F.obj.name = (F.obj.name || '').trim();
    if (!F.obj.name) return drawForm(0, '先起个名字');
    F.save(F.obj); save(); F.back('pop');
  },
  formDel(){ if (confirm('删掉「' + F.obj.name + '」?')) { F.del(F.obj); save(); F.back('pop'); } },
};
stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('.out-push,.out-pop,.out-down')) return;
  if (b.tagName === 'BUTTON') e.preventDefault();
  ACT[b.dataset.act](b);
});
function onField(e){
  const el = e.target, num = v => v === '' ? NaN : parseFloat(v);
  if (el.dataset.pick) { cur[el.dataset.pick] = el.value || null; save(); }
  else if (el.dataset.ff && F) { F.obj[el.dataset.ff] = el.type === 'number' ? num(el.value) : el.value; }
  else if (el.dataset.f && draft) { draft[el.dataset.f] = el.type === 'number' ? num(el.value) : el.value; }
  else if (el.dataset.s !== undefined && draft) {
    const s = draft.steps[+el.dataset.s], k = el.dataset.k;
    if (k === 't') { if (e.type !== 'change') return; s.t = el.value; if (s.t === 'pour' && !s.to) s.to = draft.water; drawEdit(); }
    else s[k] = num(el.value);
  }
}
stage.addEventListener('input', onField);
stage.addEventListener('change', onField);

home();
</script>
</body>
</html>
