<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>暖流 · 现金流</title>
  <meta name="description" content="每天一分钟，看清自己有多少钱、多少可以用。">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="暖流">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar">
    <strong id="nav-title"></strong>
    <button type="button" id="eye" class="nav-btn" aria-label="显示或隐藏金额">
      <svg class="eye-on" viewBox="0 0 24 24"><path d="M2.500 12s3.500-6.500 9.500-6.500S21.500 12 21.500 12s-3.500 6.500-9.500 6.500S2.500 12 2.500 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16M9.900 5.800A9.600 9.600 0 0 1 12 5.500c6 0 9.500 6.500 9.500 6.500a17 17 0 0 1-2.900 3.700M6.300 7.400A16.500 16.500 0 0 0 2.500 12s3.500 6.500 9.500 6.500c1.500 0 2.900-.400 4.100-1M9.900 9.900a3 3 0 0 0 4.200 4.200"/></svg>
    </button>
  </header>
  <div class="large-title"><span id="page-sub"></span><h1 id="page-title">暖流</h1></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="主导航">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V19a1.5 1.5 0 0 1-1.5 1.5h-3.5v-6h-6v6H5.500A1.5 1.5 0 0 1 4 19z"/></svg><span>总览</span>
    </a>
    <a href="#bills" data-tab="bills">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8.500 3v4M15.500 3v4"/></svg><span>开销</span>
    </a>
    <a href="#entry" data-tab="entry" class="tab-main" aria-label="记录今天的余额">
      <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg><span>记录</span>
    </a>
    <a href="#income" data-tab="income">
      <svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg><span>收入</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.500M12 18.500V21M3 12h2.500M18.500 12H21M5.600 5.600l1.800 1.800M16.600 16.600l1.800 1.800M5.600 18.400l1.800-1.800M16.600 7.400l1.800-1.800"/></svg><span>设置</span>
    </a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/shared.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/seed-data.js"></script><!-- 只在 APK 里存在：一次性导入的个人资料 -->
  <script src="js/app.js"></script>
</body>
</html>
